[project]
name = "arc-autoresearch"
version = "0.1.0"
description = "Autonomous neuro-symbolic agent research for ARC-AGI-3"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ── Core ──────────────────────────────────────────────────────────────────
    "torch>=2.4.0",              # neural components, tensor ops throughout
    "numpy>=1.26.0",             # grid manipulation, state deltas

    # ── ARC-AGI-3 Environment ─────────────────────────────────────────────────
    "gymnasium>=0.29.0",         # standard gym interface for env_setup.py
    "arc-agi",                   # ARC-AGI-3 toolkit (imports as arc_agi)

    # ── Perception (Step vi) ───────────────────────────────────────────────────
    "scikit-image>=0.22.0",      # connected-component labeling, region props
    "scipy>=1.12.0",             # spatial analysis, symmetry detection

    # ── DSL Search (Step iii) ─────────────────────────────────────────────────
    "networkx>=3.2.0",           # DSL operation graph, precondition DAG
    "lark>=1.1.9",               # DSL grammar definition and parsing

    # ── Library Learning / Compression (Step iii) ────────────────────────────
    # DreamCoder / STITCH-style abstraction induction — install from source:
    # pip install git+https://github.com/mlb2251/stitch.git
    "stitch-core>=0.1.0",        # program compression, macro-op induction

    # ── World Model / MDL (Step viii) ─────────────────────────────────────────
    "sympy>=1.12.0",             # symbolic rule representation and simplification

    # ── Memory / Retrieval (Step vii) ─────────────────────────────────────────
    "faiss-cpu>=1.8.0",          # fast approximate nearest-neighbor retrieval
                                 # swap for faiss-gpu if a GPU is available

    # ── Hypothesis Scoring (Step ii) ──────────────────────────────────────────
    "scikit-learn>=1.4.0",       # demo-consistency scoring, clustering utilities

    # ── Utilities ─────────────────────────────────────────────────────────────
    "requests>=2.31.0",          # env downloading in env_setup.py
    "tqdm>=4.66.0",              # progress bars during episode iteration
    "pandas>=2.2.0",             # results.tsv loading in analysis.ipynb
    "matplotlib>=3.8.0",         # analysis.ipynb charts
    "ipykernel>=6.29.0",         # analysis.ipynb execution
]

[project.optional-dependencies]
gpu = [
    # faiss-gpu is not available on Windows through the default resolver.
    # Use faiss-cpu here; Linux GPU runners can install faiss-gpu manually.
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules"]
include = [
    "agent.py",
    "prepare.py",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
